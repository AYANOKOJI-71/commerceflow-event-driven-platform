name: commerceflow
services:
  kafka:
    image: bitnami/kafka:3.8
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_KRAFT_CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_local_only
    ports: ["5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce -d commerce"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7.4-alpine
    ports: ["6380:6379"]
    command: redis-server --appendonly yes

  order-service:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: order-service } }
    environment:
      COMMERCE_ORDER_PORT: 4400
      COMMERCE_MESSAGING_MODE: kafka
      COMMERCE_STORE_MODE: postgres
      COMMERCE_KAFKA_BOOTSTRAP: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/commerce
      SPRING_DATASOURCE_USERNAME: commerce
      SPRING_DATASOURCE_PASSWORD: commerce_local_only
      COMMERCE_ALLOWED_ORIGIN: http://localhost:5180
    ports: ["4400:4400"]
    depends_on:
      kafka: { condition: service_healthy }
      postgres: { condition: service_healthy }

  inventory-service:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: inventory-service } }
    environment: { COMMERCE_KAFKA_BOOTSTRAP: kafka:9092, SERVER_PORT: 4401 }
    ports: ["4401:4401"]
    depends_on: { kafka: { condition: service_healthy } }

  payment-service:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: payment-service } }
    environment: { COMMERCE_KAFKA_BOOTSTRAP: kafka:9092, SERVER_PORT: 4402 }
    ports: ["4402:4402"]
    depends_on: { kafka: { condition: service_healthy } }

  notification-service:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: notification-service } }
    environment: { COMMERCE_KAFKA_BOOTSTRAP: kafka:9092, SERVER_PORT: 4403 }
    ports: ["4403:4403"]
    depends_on: { kafka: { condition: service_healthy } }

  catalog-service:
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { SERVICE: catalog-service } }
    environment: { SERVER_PORT: 4404, SPRING_DATA_REDIS_HOST: redis }
    ports: ["4404:4404"]
    depends_on: { redis: { condition: service_started } }

  operations-web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["5180:80"]
    depends_on: { order-service: { condition: service_started } }
