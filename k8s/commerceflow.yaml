apiVersion: v1
kind: Namespace
metadata:
  name: commerceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: commerceflow-config
  namespace: commerceflow
data:
  COMMERCE_KAFKA_BOOTSTRAP: kafka:9092
  COMMERCE_MESSAGING_MODE: kafka
  COMMERCE_STORE_MODE: postgres
---
apiVersion: v1
kind: Secret
metadata:
  name: commerceflow-secrets
  namespace: commerceflow
type: Opaque
stringData:
  SPRING_DATASOURCE_USERNAME: commerce
  SPRING_DATASOURCE_PASSWORD: replace-before-deploying
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: commerceflow
spec:
  replicas: 2
  selector: { matchLabels: { app: order-service } }
  template:
    metadata: { labels: { app: order-service } }
    spec:
      containers:
        - name: order-service
          image: ghcr.io/replace-me/commerceflow-order-service:latest
          ports: [{ containerPort: 4400 }]
          envFrom: [{ configMapRef: { name: commerceflow-config } }, { secretRef: { name: commerceflow-secrets } }]
          env:
            - name: SERVER_PORT
              value: "4400"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/commerce
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: 4400 }, initialDelaySeconds: 15 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: 4400 }, initialDelaySeconds: 30 }
          resources: { requests: { cpu: 200m, memory: 384Mi }, limits: { cpu: "1", memory: 768Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: commerceflow
spec:
  selector: { app: order-service }
  ports: [{ port: 4400, targetPort: 4400 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-web
  namespace: commerceflow
spec:
  replicas: 2
  selector: { matchLabels: { app: operations-web } }
  template:
    metadata: { labels: { app: operations-web } }
    spec:
      containers:
        - name: operations-web
          image: ghcr.io/replace-me/commerceflow-operations-web:latest
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5 }
          resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 300m, memory: 192Mi } }
---
apiVersion: v1
kind: Service
metadata:
  name: operations-web
  namespace: commerceflow
spec:
  selector: { app: operations-web }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: order-service
  namespace: commerceflow
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: order-service }
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
